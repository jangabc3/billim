spring:
  application:
    name: billim-backend

  profiles:
    active: local # 로컬 전용 민감정보(application-local.yml)를 불러오기 위한 설정. 운영은 SPRING_PROFILES_ACTIVE=prod 로 덮어쓴다.

  datasource:
    url: jdbc:postgresql://localhost:5432/billim
    username: billim
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    defer-datasource-initialization: true
    open-in-view: false # 요청 처리 내내 DB 커넥션을 붙잡지 않도록 함. 지연 로딩은 서비스 트랜잭션 안에서만 사용한다.
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  sql:
    init:
      mode: always

server:
  port: 8080

logging:
  level:
    com.billim: DEBUG

gongyunuri:
  api-key: ${GONGYUNURI_API_KEY:}

seoul:
  reservation:
    api-key: ${SEOUL_API_KEY:}

jwt:
  secret: ${JWT_SECRET}
  validity-ms: 86400000

billim:
  cors:
    # 쉼표로 구분. 로컬 기본값은 Expo 웹(localhost)과 실기기 미리보기(사설 IP).
    # 운영(application-prod.yml)에서는 환경변수 CORS_ALLOWED_ORIGINS로 실제 도메인만 지정한다.
    allowed-origin-patterns: http://localhost:*,http://192.168.*.*:*

# 헬스체크만 노출한다. (로드밸런서/컨테이너 오케스트레이터가 "서버 살아있나?" 확인하는 용도)
# env, beans, heapdump 같은 민감한 엔드포인트는 노출하지 않는다.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true # /actuator/health/liveness, /actuator/health/readiness
      show-details: never

resilience4j:
  retry:
    instances:
      gongyunuri:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - java.lang.IllegalStateException
      seoul:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - java.lang.IllegalStateException
  circuitbreaker:
    instances:
      gongyunuri:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
      seoul:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
