spring:
  application:
    name: billim-backend

  profiles:
    active: local # 로컬 전용 민감정보(application-local.yml)를 불러오기 위한 설정

  datasource:
    url: jdbc:postgresql://localhost:5432/billim
    username: billim
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

  sql:
    init:
      mode: always

server:
  port: 8080

logging:
  level:
    com.billim: DEBUG

gongyunuri:
  api-key: ${GONGYUNURI_API_KEY:}

seoul:
  reservation:
    api-key: ${SEOUL_API_KEY:}

jwt:
  secret: ${JWT_SECRET}
  validity-ms: 86400000

resilience4j:
  retry:
    instances:
      gongyunuri:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - java.lang.IllegalStateException
      seoul:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - java.lang.IllegalStateException
  circuitbreaker:
    instances:
      gongyunuri:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
      seoul:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
